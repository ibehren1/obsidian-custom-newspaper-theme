name: Build theme

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci

      # `npm run build` reads .env and copies the result into a vault, neither of
      # which exists here, so CI compiles only.
      - run: npm run build:ci

      # theme.css is the shipped artifact and is committed, so a stale copy means
      # someone edited src/ without rebuilding.
      - name: Check theme.css is up to date
        run: |
          if ! git diff --exit-code -- theme.css; then
            echo "::error::theme.css is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  # Every change to the theme bumps the patch version; see check-version.mjs.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version was bumped
        run: node check-version.mjs "${{ github.event.pull_request.base.sha }}"
